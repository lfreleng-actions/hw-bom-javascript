name: Test hw-bom GitHub Action 🧪
# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      otel_service_name:
        type: string
        description: 'The name of the service'
        required: false
        default: 'github-action-hw-bom'
      otel_exporter_otlp_endpoint:
        type: string
        description: 'The endpoint to use for the OTLP exporter'
        required: false
      otel_exporter_otlp_headers:
        type: string
        description: 'The headers to use for the OTLP exporter'
        required: false

  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for all jobs; none needs more than read access
# to the repository contents. Individual jobs override as needed.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-job:
    name: Test hw-bom GitHub Action TypeScript 🧪
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check-all

  # GitHub runs this action straight from the repository, so dist/ has to
  # be committed. That makes it possible for the bundle to drift from src/,
  # and a reviewer reading the diff would see the sources change while the
  # code that actually runs did not. Rebuild and compare.
  check-dist:
    name: Committed bundle matches sources 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and compare against the committed bundle
        run: |
          # Rebuild and compare against the committed bundle
          npm run build
          # git diff sees modified tracked files only, so a build that
          # emits a new artefact nobody committed would slip through.
          # --porcelain with --untracked-files=all reports additions,
          # modifications and deletions alike.
          drift="$(git status --porcelain --untracked-files=all -- dist/)"
          if [ -n "${drift}" ]; then
            echo "The committed bundle differs from a fresh build ❌"
            printf '%s\n' "${drift}"
            echo "Run 'npm run build' and commit the result."
            echo "Committed bundle is stale ❌" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Committed bundle matches the sources ✅"
          echo "Committed bundle matches the sources ✅" \
            >> "$GITHUB_STEP_SUMMARY"

  dogfood:
    name: Run hw-bom GitHub Action on this repository 🐶🍖
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            api.honeycomb.io:443

      - name: Collect Hardware Information 🔎
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io"
          OTEL_EXPORTER_OTLP_HEADERS:
            "x-honeycomb-team=${{ secrets.HONEYCOMB_API_KEY }}"
        id: hw-info
        # The self-repository form loads the action from the runner's own
        # copy of it, as an external caller would. There is no checkout or
        # npm ci in this job, so the step also proves dist/ is
        # self-contained.
        uses: $/
        with:
          otel_service_name: lfreleng-actions-hw-bom-javascript
          otel_exporter_otlp_headers:
            '"x-honeycomb-team": ''${{ secrets.HONEYCOMB_API_KEY }}'','
          otel_exporter_otlp_endpoint: 'https://api.honeycomb.io'

      - name: Display Hardware Information 🖥️
        run: |
          echo "Cloud Provider: ${STEPS_HW_INFO_OUTPUTS_CLOUD}"
          echo "Instance Type: ${STEPS_HW_INFO_OUTPUTS_INSTANCETYPE}"
          echo "Workflow RunID: ${STEPS_HW_INFO_OUTPUTS_WORKFLOWRUN}"
          echo "CPU: ${STEPS_HW_INFO_OUTPUTS_CPU}"
          echo "CPU Vendor: ${STEPS_HW_INFO_OUTPUTS_CPUVENDOR}"
          echo "CPU Model: ${STEPS_HW_INFO_OUTPUTS_CPUMODEL}"
          echo "CPU Cores: ${STEPS_HW_INFO_OUTPUTS_CPUNUMPROC}"
          echo "GPU Vendor: ${STEPS_HW_INFO_OUTPUTS_GPUVENDOR}"
          echo "GPU Model: ${STEPS_HW_INFO_OUTPUTS_GPUMODEL}"
          echo "Memory: ${STEPS_HW_INFO_OUTPUTS_MEMTOTAL}"
          echo "Disk Total: ${STEPS_HW_INFO_OUTPUTS_DISKTOTAL}"
          echo "Disk Used: ${STEPS_HW_INFO_OUTPUTS_DISKUSED}"
          echo "Disk Free: ${STEPS_HW_INFO_OUTPUTS_DISKFREE}"
        env:
          STEPS_HW_INFO_OUTPUTS_CLOUD: ${{ steps.hw-info.outputs.cloud }}
          STEPS_HW_INFO_OUTPUTS_INSTANCETYPE: ${{ steps.hw-info.outputs.instanceType }}
          STEPS_HW_INFO_OUTPUTS_WORKFLOWRUN: ${{ steps.hw-info.outputs.workflowRun }}
          STEPS_HW_INFO_OUTPUTS_CPU: ${{ steps.hw-info.outputs.cpu }}
          STEPS_HW_INFO_OUTPUTS_CPUVENDOR: ${{ steps.hw-info.outputs.cpuVendor }}
          STEPS_HW_INFO_OUTPUTS_CPUMODEL: ${{ steps.hw-info.outputs.cpuModel }}
          STEPS_HW_INFO_OUTPUTS_CPUNUMPROC: ${{ steps.hw-info.outputs.cpuNumProc }}
          STEPS_HW_INFO_OUTPUTS_GPUVENDOR: ${{ steps.hw-info.outputs.gpuVendor }}
          STEPS_HW_INFO_OUTPUTS_GPUMODEL: ${{ steps.hw-info.outputs.gpuModel }}
          STEPS_HW_INFO_OUTPUTS_MEMTOTAL: ${{ steps.hw-info.outputs.memTotal }}
          STEPS_HW_INFO_OUTPUTS_DISKTOTAL: ${{ steps.hw-info.outputs.diskTotal }}
          STEPS_HW_INFO_OUTPUTS_DISKUSED: ${{ steps.hw-info.outputs.diskUsed }}
          STEPS_HW_INFO_OUTPUTS_DISKFREE: ${{ steps.hw-info.outputs.diskFree }}
