[extend]
useDefault = true

[[allowlists]]
description = "Generated action bundle"
# dist/index.js is minified third-party code rebuilt from src/, which is
# scanned. Its chained assignments ('a.fooKey=b.bar=void') match the
# generic-api-key rule, and the identifiers change on every rebuild.
paths = ['''^dist/index\.js$''']
